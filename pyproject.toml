[project]
name = "dnd-helper"
version = "0.1.0"
description = "DnD Helper for Polish language players"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Marcin Kalinski", email = "marcinkalinski1997@gmail.com" }]
dependencies = [
    "pelican",
    "invoke",
    "pyyaml",
    "livereload",
    "toml>=0.10.2",
    "markdown",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dnd_helper"]
